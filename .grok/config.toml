# Project-scoped Grok config for the local Escalation MCP.
# Portable across macOS + Windows — no machine-specific absolute paths.
# Run from repo root:  python demo/run_hands_off.py
# (that sets HACKUTA_ROOT / HACKUTA_PYTHON). Plain `grok` also works if
# your venv python is on PATH and you start grok in this repo.
# See escalation_mcp/README.md and ~/.grok/docs/user-guide/07-mcp-servers.md

[ui]
permission_mode = "always-approve"

[mcp_servers.escalation]
command = "${HACKUTA_PYTHON:-python}"
args = ["-m", "escalation_mcp"]
cwd = "${HACKUTA_ROOT:-.}"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60
tool_timeouts = { get_human_response = 60 }
# live = real Chert/LiveKit call. Use mock for offline MCP tests.
# AGENT_IDLE_TONE=0: silence between Mentor turns (continuous tone sounded like static).
# FACETIME_AUDIO_GRACE_S: short wait AFTER answer before Mentor greets (video warmup).
env = { ESCALATION_MODE = "live", AGENT_IDLE_TONE = "0", FACETIME_AUDIO_GRACE_S = "1.0", PYTHONPATH = "${HACKUTA_ROOT:-.}", PYTHONUTF8 = "1" }
