# Project-scoped Grok config for the local Escalation MCP.
# See escalation_mcp/README.md and ~/.grok/docs/user-guide/07-mcp-servers.md

[mcp_servers.escalation]
command = "/Users/ronismaili/PycharmProjects/HackUTA/.venv/bin/python"
args = ["-m", "escalation_mcp"]
cwd = "/Users/ronismaili/PycharmProjects/HackUTA"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60
tool_timeouts = { get_human_response = 30 }
# live = real Chert/LiveKit call. Use mock for offline MCP tests.
# AGENT_IDLE_TONE=0: silence between Mentor turns (continuous tone sounded like static).
# FACETIME_AUDIO_GRACE_S: extra wait AFTER the call is answered (remote audio seen).
env = { ESCALATION_MODE = "live", AGENT_IDLE_TONE = "0", FACETIME_AUDIO_GRACE_S = "2.5", PYTHONPATH = "/Users/ronismaili/PycharmProjects/HackUTA", PYTHONUTF8 = "1" }
